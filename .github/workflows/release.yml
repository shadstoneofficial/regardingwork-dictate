name: prepare macOS artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build unsigned arm64 app for signing handoff
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "invalid version: $VERSION" >&2
            exit 64
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

      - name: Build app and checksum
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-app.sh

      - name: Verify unsigned bundle identity
        run: |
          APP="dist/RegardingWork Dictate.app"
          test "$(defaults read "$APP/Contents/Info" CFBundleIdentifier)" = "com.regardingwork.dictate"
          test -x "$APP/Contents/MacOS/regardingwork-dictate"
          shasum -a 256 -c "dist/regardingwork-dictate-v${{ inputs.version }}-macos-arm64.zip.sha256"

      - name: Upload signing-handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: regardingwork-dictate-v${{ inputs.version }}-macos-arm64-unsigned
          path: |
            dist/regardingwork-dictate-v${{ inputs.version }}-macos-arm64.zip
            dist/regardingwork-dictate-v${{ inputs.version }}-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

# This workflow deliberately does not use production Apple credentials, create
# tags, or publish GitHub releases. Follow SECURITY.md's signing handoff on the
# trusted signing machine, then publish only with explicit approval.
